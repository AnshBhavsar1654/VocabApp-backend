[project]
name = "backend"
version = "0.1.0"
description = "German Vocab App Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.1.8",
    "colorama==0.4.6",
    "deep-translator==1.11.4",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "gtts==2.5.4",
    "h11==0.16.0",
    "httpx==0.28.1",
    "idna==3.19",
    "langdetect==1.0.9",
    "psycopg2-binary==2.9.10",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "ruff==0.11.13",
    "six==1.17.0",
    "soupsieve==2.9.2",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "supabase==2.31.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
